{{ define "main" }}
<article class="page">
  {{ with .Section }}<p class="eyebrow">{{ . }}</p>{{ end }}
  <h1>{{ .Title }}</h1>
  {{ if .Date }}{{ if ne .Section "" }}<p class="eyebrow">{{ .Date.Format "2 January 2006" }}</p>{{ end }}{{ end }}
  <div class="prose">{{ .Content }}</div>
</article>
{{ end }}
