# The projects on the home page. `featured` gets the large block; `projects` the grid, in this
# order. Each project's shape and color are the Bauhaus primaries: circle, triangle or square;
# red, yellow or blue.

featured:
  name: Homeostat
  url: https://homeostat.kausalflow.com/
  eyebrow: Featured project
  tagline: Plant data that knows why it moved.
  description: >-
    Homeostat generates process-industry time series that behave like a real plant: closed control
    loops, drifting instruments, hidden disturbances and lab results that arrive hours late. Every
    value comes with the truth behind it.
  points:
    - title: Live plants
      text: Simulated plants that run day and night, with sensor data every ten minutes and lab results released weekly.
    - title: A weekly benchmark
      text: Every Friday, predict the past week's lab results from its sensor data, on your own or with an AI coding agent.
    - title: Open source
      text: A Python package (pip install homeostat) under the Apache-2.0 licence, with full documentation.
  links:
    - name: Visit Homeostat
      url: https://homeostat.kausalflow.com/
    - name: Live plants
      url: https://homeostat.kausalflow.com/live/
    - name: Documentation
      url: https://homeostat.kausalflow.com/docs/

