######################## default configuration ####################
# The site's own layouts (layouts/) and styles (static/css/site.css): the calm Bauhaus look it
# shares with homeostat.kausalflow.com. The projects on the home page are in data/projects.yaml.
baseURL = "https://kausalflow.com/"
title = "KausalFlow"
summaryLength = "10"

[pagination]
pagerSize = 6

############################# Modules ##############################
[module]
[module.hugoVersion]
min = "0.128.0"

############################# Outputs ##############################
[outputs]
home = ["HTML", "RSS"]

[markup]
[markup.goldmark.renderer]
unsafe = true
